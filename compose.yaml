services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    environment:
      PORT: "4000"
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health').then(r => { if (!r.ok) throw Error(r.status) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    environment:
      API_ORIGIN: http://api:4000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r => { if (!r.ok) throw Error(r.status) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  test-db:
    image: postgres:18-alpine
    profiles: ["test-db"]
    environment:
      POSTGRES_DB: bankbolt_test
      POSTGRES_USER: bankbolt_test
      POSTGRES_PASSWORD: bankbolt_test
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55433}:5432"
    volumes:
      - test-db-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U bankbolt_test -d bankbolt_test",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  test-db-data:
